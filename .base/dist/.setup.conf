# ═════════════════════════════════════════════════════════════════════
# setup.conf — source of truth for runtime configuration.
# ═════════════════════════════════════════════════════════════════════
#
# setup.sh reads this file + system detection → generates .env and
# compose.yaml. Those two files are DERIVED ARTIFACTS — never edit
# them directly. Any manual change to .env / compose.yaml is silently
# overwritten on the next ./build.sh / ./run.sh that omits --no-env.
# Edit this file instead, then re-run a build / run wrapper (or
# explicitly ./run.sh --setup) to regenerate the artifacts.
#
# How to edit:
#
#   1. (Recommended) ./setup_tui.sh — interactive TUI editor. Walks
#      each section, validates input against the same rules setup.sh
#      uses, and rewrites in place preserving section structure. The
#      TUI shows per-key documentation so this file can stay terse.
#
#   2. Manual edit — supported. Keep the section structure intact;
#      ad-hoc keys outside the documented sections are silently
#      dropped (no warning). After a manual edit, re-run any wrapper
#      (or ./run.sh --setup) to regenerate .env.generated / compose.yaml.
#
# Override layering (three files, lowest precedence first):
#
#   - Template default lives at <template>/.setup.conf.
#   - Per-repo override lives at <repo>/.setup.conf (created
#     automatically on first init). Committed: it is the repo's setting,
#     the one CI and every other checkout uses.
#   - Per-worktree override lives at <repo>/.setup.conf.local. Gitignored,
#     never touched by tooling, visible only on this machine. Use it for
#     what is yours rather than the repo's -- above all `[project] name`,
#     so two worktrees of one repo can run at the same time. Write it with
#     `./setup.sh set --local <section>.<key> <value>`.
#   - Section-level replace, at EVERY step: a section present in a higher
#     layer fully replaces the lower layer's section. Sections a layer
#     omits fall through — there is no key-level merge inside a section,
#     because eight of the sections below are `<prefix>_N` ordered lists
#     and a half-overridden ordered list is not a configuration anyone
#     wrote.
#
#   `./setup.sh deploy` REFUSES to build a field bundle while
#   .setup.conf.local exists (pass --allow-local-override to accept it):
#   a field artifact must not silently depend on a config layer that is
#   not under version control.
#
# Syntax: lines starting with # and empty lines are ignored.
# Format is key = value (whitespace around keys / values is trimmed).
# Full per-key reference: README "Configuration" section, or run
# `./setup_tui.sh <section>` for interactive help.

# ═════════════════════════════════════════════════════════════════════
# [project] — the compose project name
# ═════════════════════════════════════════════════════════════════════
# name: the compose project this checkout runs under. Every container,
# network and volume the stack creates is namespaced by it, so two
# checkouts that resolve the SAME name collide: the second `run` reuses the
# first's containers.
#
# Ships EMPTY, which means "derive as before" (<DOCKER_HUB_USER>-<IMAGE_NAME>),
# so setting it is opt-in and an upgrade changes nothing.
#
# Set it to run two worktrees of one repo at the same time. Put that value
# in the gitignored `.setup.conf.local`, not here -- a per-worktree name is
# yours, not the repo's:
#
#   ./setup.sh set --local project.name myrepo-wt2
#
# Rule: lowercase letters, digits, `-` and `_`, starting with a letter or a
# digit (docker compose's own rule). Changing it does NOT move the image
# tag -- that is [image] / DOCKER_HUB_USER, deliberately a separate axis.
[project]
name =

# ═════════════════════════════════════════════════════════════════════
# [image] — IMAGE_NAME detection rules (tried in numeric order)
# ═════════════════════════════════════════════════════════════════════
[image]
rule_1 = prefix:docker_
rule_2 = suffix:_ws
rule_3 = @basename

# ═════════════════════════════════════════════════════════════════════
# [build] — Dockerfile build args + arch + build network
# ═════════════════════════════════════════════════════════════════════
[build]
target_arch =
network = auto
arg_1 = APT_MIRROR_UBUNTU=tw.archive.ubuntu.com
arg_2 = APT_MIRROR_DEBIAN=mirror.twds.com.tw
arg_3 = TZ=Asia/Taipei

# ═════════════════════════════════════════════════════════════════════
# [deploy] — GPU reservation (compose.yaml deploy.resources)
# ═════════════════════════════════════════════════════════════════════
[deploy]
gpu_mode = auto
gpu_count = all
gpu_capabilities = gpu compute utility graphics
# gpu_runtime: container runtime for GPU (auto detects Jetson/csv-mode
# nvidia-container-toolkit -> runtime: nvidia; nvidia forces it; off omits).
# Renamed from `runtime` in v0.41.0; the old key still works as a permanent
# alias (deprecation warning), removal at v1.0.0 (see doc/deprecations.md).
gpu_runtime = auto
# dri_groups: grant /dev/dri access for hardware GL on non-NVIDIA (Intel/
# AMD iGPU) hosts. auto = detect the host's video+render GIDs at setup time
# and add them via group_add to GUI services (numeric GIDs, per-host). off
# = never. Complements the NVIDIA gpu_* path; harmless when /dev/dri absent.
dri_groups = auto

# ═════════════════════════════════════════════════════════════════════
# [lifecycle] — container lifecycle policy
# ═════════════════════════════════════════════════════════════════════
# restart: docker restart policy. One of: no | always | unless-stopped |
# on-failure | on-failure:N. DEPLOY-SCOPED: it applies to deployable stage
# services and to a `setup.sh deploy` field bundle, and NEVER to devel or a
# `*-test` stage. Those two are excluded by design -- a devel container IS
# the interactive shell (auto-restart would relaunch it the moment you type
# `exit`, forever) and a test stage exits 0 when it passes (base#493), so a
# restart policy would loop it. A deployable service is the opposite: it is
# meant to run forever, so the default `unless-stopped` auto-starts it
# again after a crash and after a host reboot. Set `no` to opt out, or
# `on-failure` / `on-failure:N` to auto-retry a failure without restarting
# after a clean exit.
#
# init: run Docker's daemon init (docker-init = tini) as PID 1 via compose
# `init: true` -- a zombie reaper + signal forwarder. Default `true` (ON):
# transparent to a correct single-service workload, and running as PID 1
# without reaping / signal forwarding is a footgun (stop hangs until
# SIGKILL; orphaned children pile up as zombies). Set `false` to omit the
# init: field. tini forwards signals only to its direct child (PID 2 = the
# entrypoint); an entrypoint that itself supervises children must still
# trap + forward. Reaping, however, is comprehensive.
#
# watchdog (#797): a generic, health-check-driven supervised-restart
# watchdog for the container's one service. ALL knobs default OFF -- with
# watchdog_check empty (the master switch) there is no watchdog and no
# behavior change. It complements `restart` rather than duplicating it:
# `restart` only recovers a container that EXITS, while the watchdog is
# the only mechanism that recovers a service that is alive but wedged.
# The app supplies the
# health-check COMMAND (its exit status is the health signal); base ships
# the supervision loop. After watchdog_start_period, the check runs every
# watchdog_interval (bounded by watchdog_timeout); after watchdog_failures
# consecutive failures the watchdog_on_fail action fires:
#   restart-container (default) -- exit the container so Docker's restart
#     policy (see `restart` above) restarts it; Docker's backoff absorbs
#     storms.
#   restart-service -- restart only the in-container service in place
#     (needs init = true as the surviving PID1), counting restarts; on
#     reaching watchdog_max_restarts it gives up LOUDLY, runs the optional
#     watchdog_notify command, then exits the container.
# The entrypoint sources /usr/local/lib/base/watchdog.sh unconditionally
# (a no-op while watchdog_check is empty). Uncomment + set to opt in.
[lifecycle]
restart = unless-stopped
init = true
# watchdog_check =
# watchdog_interval = 30
# watchdog_timeout = 10
# watchdog_start_period = 0
# watchdog_failures = 3
# watchdog_on_fail = restart-container
# watchdog_max_restarts = 5
# watchdog_notify =

# ═════════════════════════════════════════════════════════════════════
# [gui] — GUI display support
# ═════════════════════════════════════════════════════════════════════
[gui]
mode = auto

# ═════════════════════════════════════════════════════════════════════
# [network] — network mode, IPC, port mappings
# ═════════════════════════════════════════════════════════════════════
# mode defaults to `host` (#794): it is the safe default for the ROS-
# plurality org -- cross-machine ROS (both ROS 1 and ROS 2) MUST stay on
# host, since a bridge's 172.17.x address is not routable off-box and a
# scanner / LiDAR would go silently unreachable across machines. Tighten a
# CONFIRMED single-machine repo (app / AI tooling) to bridge as an opt-in:
#   ./setup.sh set network.mode bridge
#   ./setup.sh set network.ipc private
#   ./setup.sh apply
# Under GUI + bridge the container hostname is auto-pinned to the host's
# name so local X11 still authenticates. See README "Network mode" for the
# full opt-in recipe and the cross-machine-ROS warning.
[network]
mode = host
ipc = host
pid = private
network_name =
# port_N: published host:container port mappings. Only take effect once
# network.mode = bridge (compose ignores ports under host networking).
# Uncomment + set after opting into bridge, e.g.:
# port_1 = 8080:80

# ═════════════════════════════════════════════════════════════════════
# [security] — container privilege / capabilities / security_opt
# ═════════════════════════════════════════════════════════════════════
[security]
# Privileges are opt-in (#466). Defaults are lean so lightweight repos
# (static servers, CI runners) and tooling stages that `extends: devel`
# stay clean. Enable only what the container needs -- uncomment below,
# or run `./setup_tui.sh` (security page) / `setup.sh add security.cap_add
# SYS_ADMIN`.
#
# Per-stage (#526): cap_add_<N> / cap_drop_<N> / security_opt_<N> (and the
# matching *_inherit toggles) are overridable per Dockerfile stage via a
# [stage:<name>] section, e.g. `[stage:probe]` + `security.cap_add_inherit
# = false` drops all inherited caps for a read-only stage while a flash
# stage keeps them. Same append-default / *_inherit=false-replaces rule as
# volumes / ports / env.
privileged = false
# cap_add_1 = SYS_ADMIN
# cap_add_2 = NET_ADMIN
# cap_add_3 = MKNOD
# security_opt_1 = seccomp:unconfined

# ═════════════════════════════════════════════════════════════════════
# [resources] — container resource limits (shm_size, etc.)
# ═════════════════════════════════════════════════════════════════════
[resources]
shm_size =

# ═════════════════════════════════════════════════════════════════════
# [environment] — machine-bound / set-once env defaults (env_N = KEY=VALUE)
# ═════════════════════════════════════════════════════════════════════
# Holds env vars that are STABLE for this image/repo -- the kind that do
# not change when you switch machines or tasks (e.g. a fixed RMW
# implementation, a baked-in default ROS_DOMAIN_ID). Per the env/workload
# boundary (ADR-00000003, axis A: "does it change when you switch
# machines?"), these become the runtime-stage `ENV` bake (#497 S3) so a
# bare `docker run` of the field image still gets sane defaults.
#
# Per-task / volatile env vars (API tokens, dataset selectors, a LOG_LEVEL
# you flip between runs) do NOT belong here -- they go in the gitignored
# `.env` workload overlay (#497 S2), which takes effect with only
# `just run` (no regenerate, no SETUP_CONF_HASH drift, no git churn).
[environment]

# ═════════════════════════════════════════════════════════════════════
# [tmpfs] — RAM-backed mount points (tmpfs_N = /path[:size=N])
# ═════════════════════════════════════════════════════════════════════
[tmpfs]

# ═════════════════════════════════════════════════════════════════════
# [devices] — host device bindings + cgroup rules
# ═════════════════════════════════════════════════════════════════════
[devices]
# Device binding is opt-in (#466). Uncomment to bind the whole /dev tree,
# or add specific nodes via `setup.sh add devices.device /dev/video0` or
# the TUI devices page.
# device_1 = /dev:/dev

# ═════════════════════════════════════════════════════════════════════
# [volumes] — workspace mount + extras (mount_N = host:container[:mode])
# ═════════════════════════════════════════════════════════════════════
[volumes]
mount_1 =

# ═════════════════════════════════════════════════════════════════════
# [additional_contexts] — extra named build contexts (context_N = name=source)
# ═════════════════════════════════════════════════════════════════════
[additional_contexts]

# ═════════════════════════════════════════════════════════════════════
# [logging] — Docker logging driver + rotation defaults + host file mount
#
# Applied uniformly to every compose service (devel / test / any
# auto-emitted Dockerfile stage). Optional per-service override is
# `[logging.<service>]` (key-level merge on top of [logging] — keys
# absent in the per-service section fall back to global). Closes #310.
#
# local_path (#328): when non-empty, setup.sh emits a per-service
# host bind mount `<resolved>:/var/log/<repo>` so container stdout
# can be tee'd to a host-side file. The helper that performs the
# tee is shipped into every image at the stable in-image path
# `/usr/local/lib/base/_entrypoint_logging.sh` (#368; COPY'd by
# Dockerfile.example's devel stage). Source it from the repo's
# `script/entrypoint.sh` with a single un-guarded line:
#   . /usr/local/lib/base/_entrypoint_logging.sh
# The helper is a no-op when LOG_FILE_PATH is unset, so the source
# line is safe to add unconditionally. Path semantics for the
# local_path value:
#   ./log/      relative to repo root
#   /abs/path/  absolute, used verbatim
#   ~/dir/      ~ expanded to $HOME
#   (empty)     feature disabled (default, back-compat)
# Default is empty — opt-in per repo via per-repo setup.conf.
# ═════════════════════════════════════════════════════════════════════
[logging]
driver = json-file
max_size = 10m
max_file = 3
compress = true
local_path =
# container_log_keep / container_log_days (#805): retention for the
# local_path per-start container logs. Each container start writes a
# per-start file log/<svc>/<svc>_<ts>.log and repoints the stable
# log/<svc>/<svc>.log symlink at it (glog-style); old per-start files are
# pruned by keep-count AND age (keep at most N most recent AND drop older
# than D days; stricter wins), never the symlink. Mirrors
# wrapper_transcript_keep / _days.
container_log_keep = 20
container_log_days = 14
# wrapper_transcript (#606): tee each non-interactive container-ops verb
# (build / setup / stop / prune / upgrade) to a plaintext transcript under
# log/<verb>/<ts>-<traceid8>.log for debugging. Set false to disable.
# The WRAPPER_TRANSCRIPT env var OVERRIDES this key for one invocation, in
# both directions (WRAPPER_TRANSCRIPT=false turns capture off with the key
# left at true, and vice versa) -- that is how CI / a test run opts out
# without editing this committed file. Only true / false are accepted
# there: any other value aborts the verb instead of silently falling back
# to this key. Unset or empty means no override.
# wrapper_transcript_keep / _days: per-verb retention (keep at most N most
# recent AND drop older than D days; stricter wins).
wrapper_transcript = true
wrapper_transcript_keep = 20
wrapper_transcript_days = 14
