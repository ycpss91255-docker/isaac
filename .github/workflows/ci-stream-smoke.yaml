name: "CI: Stream Smoke"

# Tier A producer-side smoke (isaac#172): boot the stream stage on a
# self-hosted GPU runner and assert Isaac's WebRTC livestream actually
# serves a client -- a headless-Chromium WebRTC peer attaches (no frame
# assertion; that is Tier B), the stream-start sequence is asserted from the
# kit log, and the connection is held for a
# dwell window that fails if Kit dies or the streams stop (isaac#233;
# before that this only checked the signaling port, so a Kit that died on
# first client attach passed green). Hosted runners have no GPU, so this
# is the only place that path is exercised in CI.
#
# Heavy (minutes), so it runs as the stream group's GPU job (isaac#434): from
# main.yaml's `stream-smoke` job when stream files change in a PR, and on
# every push to main and release tag. There is no nightly run: over its last
# 100 scheduled runs it failed 86 times and nobody acted on it. It can still
# be started by hand (workflow_dispatch). Tier B (browser frames) builds on
# this: isaac#173 + omniverse_web_viewer#48.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` here: a pending run replaced by a newer one would be
# cancelled, which turns main.yaml's `gate` red for a commit that did nothing
# wrong. One Isaac at a time on the GPU is guaranteed by the single self-hosted
# GPU runner, which runs one job at a time; stream_smoke.sh reaps the leftover
# `isaac-smoke-` projects of a run whose teardown never ran (isaac#291).

jobs:
  # Runs through the org reusable workflow gpu-self-hosted.yml, which owns the
  # runner labels, the fork-PR gate, the pre-checkout workspace reclaim and
  # the checkout (the fork-PR gate lives on main.yaml's `stream-smoke` caller job;
  # a manual dispatch is a non-PR event, so the gate passes). The step logic lives in script/ci/stream_smoke_job.sh
  # (guard: test/bats/smoke/gpu_job_scripts_spec.bats).
  #
  # The kit log used to be uploaded as the `stream-smoke-kit-log` artifact on
  # failure. The reusable workflow runs one script step and has no upload step
  # after it, so the script prints the full kit log in a collapsed group of
  # the job log instead.
  stream-smoke:
    uses: ycpss91255-docker/.github/.github/workflows/gpu-self-hosted.yml@v0.4.0
    with:
      run-script: ./script/ci/stream_smoke_job.sh
      # Boot budget (SMOKE_TIMEOUT 600s) + client-connect budget
      # (SMOKE_CONNECT_TIMEOUT 120s) + dwell (SMOKE_DWELL 30s) + build/teardown.
      timeout-minutes: 30
