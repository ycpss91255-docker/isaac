name: Stream Smoke (GPU)

# Tier A producer-side smoke (isaac#172): boot the stream stage on a
# self-hosted GPU runner and assert Isaac's WebRTC livestream actually
# serves a client -- a headless-Chromium WebRTC peer attaches (no frame
# assertion; that is Tier B), the stream-start sequence is asserted from the
# kit log, and the connection is held for a
# dwell window that fails if Kit dies or the streams stop (isaac#233;
# before that this only checked the signaling port, so a Kit that died on
# first client attach passed green). Hosted runners have no GPU, so this
# is the only place that path is exercised in CI.
# Heavy (minutes) + occasionally flaky -> nightly + manual, NOT per-PR.
# Tier B (browser frames) builds on this: isaac#173 + omniverse_web_viewer#48.

on:
  schedule:
    - cron: '0 19 * * *'   # nightly (UTC)
  workflow_dispatch:

# Only one Isaac on the GPU at a time; never cancel a run mid-teardown
# (would orphan a GPU-holding container).
concurrency:
  group: stream-smoke
  cancel-in-progress: false

jobs:
  # Runs through the org reusable workflow gpu-self-hosted.yml, which owns the
  # runner labels, the fork-PR gate, the pre-checkout workspace reclaim and
  # the checkout (schedule / workflow_dispatch are non-PR events, so the gate
  # always passes here). The step logic lives in script/ci/stream_smoke_job.sh
  # (guard: test/bats/smoke/gpu_job_scripts_spec.bats).
  #
  # The kit log used to be uploaded as the `stream-smoke-kit-log` artifact on
  # failure. The reusable workflow runs one script step and has no upload step
  # after it, so the script prints the full kit log in a collapsed group of
  # the job log instead.
  stream-smoke:
    uses: ycpss91255-docker/.github/.github/workflows/gpu-self-hosted.yml@main
    with:
      run-script: ./script/ci/stream_smoke_job.sh
      # Boot budget (SMOKE_TIMEOUT 600s) + client-connect budget
      # (SMOKE_CONNECT_TIMEOUT 120s) + dwell (SMOKE_DWELL 30s) + build/teardown.
      timeout-minutes: 30
