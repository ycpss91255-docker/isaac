name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# call-release uses softprops/action-gh-release@v2 which needs
# contents: write to create a GitHub Release. Reusable workflow
# permissions intersect with the caller's, and GitHub Actions'
# default GITHUB_TOKEN is read-only, so this grant must live here
# (release-worker.yaml declaring it upstream is not enough).
permissions:
  contents: write

jobs:
  call-docker-build:
    uses: ycpss91255-docker/base/.github/workflows/build-worker.yaml@v0.42.0
    with:
      image_name: docker
      # Isaac Sim base image is itself the runtime (15+ GB binary tree);
      # stripping to a separate "runtime" stage would save little while
      # forcing duplicate /isaac-sim copies. The runtime stage in
      # Dockerfile is intentionally commented out — disable the
      # base repo's build_runtime default so CI doesn't try to target it.
      build_runtime: false
      # Isaac Sim BASE_IMAGE is ~15 GB extracted; ubuntu-latest's ~14 GB
      # free disk is below threshold, so attempt 1 of every Isaac PR
      # rolls the dice on "no space left on device" during BuildKit COPY
      # (PR #68 attempt 1 lost, attempt 2 passed by timing luck). The
      # opt-in step from base#470 removes ~30 GB of Android SDK / .NET /
      # GHC tool-cache before buildx starts.
      free_disk_space: true

  # M1 hosted-unit gate (ADR-0017 section 7, isaac#130). The hosted unit
  # suite needs no Isaac runtime and no GPU: assert_pytest_baseline.sh runs it
  # in a plain slim-python container (docker run), so this gate lives on
  # ubuntu-latest instead of the single self-hosted GPU runner. That frees the
  # GPU box to do only GPU work (gpu-integration below) and lets the two run in
  # parallel -- previously both were one serial job pinned to the GPU runner.
  # Outside-collaborator PRs do NOT auto-trigger -- the org-level "Approval for
  # outside collaborators" gate holds them until a maintainer approves. This job
  # needs no fork gate of its own: ubuntu-latest runners are ephemeral and
  # GitHub-hosted, so untrusted code there costs nothing of ours.
  hosted-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The four READMEs' producer version table is generated, not written.
      # They carried `:0.0.1` for as long as `:0.0.2` existed, which is what a
      # hand-maintained table about "which Isaac Sim am I running" degrades
      # into. This fails the build instead of letting a reader find out.
      - name: Producer version table is current
        run: python3 script/ci/sync_producer_versions.py --check

      # Enforces all-green + collected >= the committed baseline (ratchet) +
      # framework pure-surface coverage >= 80%. This is the M1 acceptance floor.
      - name: Hosted unit pytest + baseline + coverage gate
        run: ./test/assert_pytest_baseline.sh

  # M2 GPU integration gate (PRD #4-int / isaac#132): boots headless Isaac for
  # real on the self-hosted GPU runner (Kit refuses to boot without an NVIDIA
  # GPU runtime). needs: hosted-unit so a fast M1 failure skips the expensive
  # GPU run; it does NOT need call-docker-build (it builds its own devel-test
  # image locally, warm-cached on the runner). The --gpu gate reads the
  # HOSTED_UNIT baseline NUMBER (it does not re-run the hosted suite).
  #
  # The job runs through the org reusable workflow gpu-self-hosted.yml, which
  # owns the runner labels, the pre-checkout workspace reclaim and the
  # checkout. The step logic lives in script/ci/gpu_integration_job.sh
  # (guard: test/bats/smoke/gpu_job_scripts_spec.bats). Every self-hosted job
  # in the org goes through that one workflow so the runner group can be
  # locked to it: a fork PR that edits its own workflow then cannot reach
  # the host.
  #
  # Fork-PR safety: this job is *structurally* gated to same-repo refs
  # (push / workflow_dispatch / PRs whose head is THIS repo), so a forked
  # PR's code can never execute on the self-hosted host -- not even if a
  # maintainer accidentally clicks "Approve and run". The reusable workflow
  # carries the same gate; this caller-side copy is kept so the gate is
  # visible here and holds even if the callee changes. This is stronger
  # than relying on the org-level outside-collaborator approval gate
  # alone, which is a human gate. Contributors with their own GPU can
  # still run the full suite in their own fork: a push in the fork
  # dispatches onto the fork owner's runner, never this host. See the
  # ycpss91255-docker/github_runner security model for the host-side
  # rationale (runner user is in the docker group == root-equivalent).
  gpu-integration:
    needs: hosted-unit
    # Non-PR events (push / tag / workflow_dispatch) always run; PR events
    # run only when the PR head repo IS this repo (a collaborator branch),
    # never a fork. Keeps untrusted fork code off the self-hosted GPU host.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ycpss91255-docker/.github/.github/workflows/gpu-self-hosted.yml@main
    with:
      run-script: ./script/ci/gpu_integration_job.sh
      timeout-minutes: 30

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ycpss91255-docker/base/.github/workflows/release-worker.yaml@v0.42.0
    with:
      archive_name_prefix: docker
