name: Main CI/CD

# CI runs per scope (isaac#434). Every test belongs to one of five groups --
# core, gui, stream, headless, docs -- and a PR runs only the groups its
# changed paths belong to (job `changes`, script/ci/changed_groups.py):
#
#   - a change to a shared layer (Dockerfile, compose, .setup.conf, config,
#     the base subtree, this file) runs every group;
#   - push to main, a release tag and a manual dispatch run every group;
#   - docs always runs (cheap lint), so a docs-only PR never reaches the
#     build or the GPU runner.
#
# The filtering is done in the `changes` job, NOT with `paths:` on the
# triggers: a workflow skipped by a trigger filter leaves a required check
# pending forever. Branch protection requires only `gate`, which runs
# always() after every other job and passes when each one succeeded or was
# skipped (GitHub's recommended pattern for path-filtered required checks).
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: >-
          Scope groups to run: all, or a comma list of core, gui, stream,
          headless, docs (docs always runs).
        required: false
        default: all
        type: string

# release uses softprops/action-gh-release@v2 which needs
# contents: write to create a GitHub Release. Reusable workflow
# permissions intersect with the caller's, and GitHub Actions'
# default GITHUB_TOKEN is read-only, so this grant must live here
# (release-worker.yaml declaring it upstream is not enough).
permissions:
  contents: write

jobs:
  # Scope selection. Every other job reads its flag from here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
      core: ${{ steps.scope.outputs.core }}
      gui: ${{ steps.scope.outputs.gui }}
      stream: ${{ steps.scope.outputs.stream }}
      headless: ${{ steps.scope.outputs.headless }}
      docs: ${{ steps.scope.outputs.docs }}
      build: ${{ steps.scope.outputs.build }}
      stages: ${{ steps.scope.outputs.stages }}
      bats_skip: ${{ steps.scope.outputs.bats_skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `git diff base...head` needs both refs reachable.
          fetch-depth: 0
      - name: Select the scope groups
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_GROUPS: ${{ inputs.groups }}
        run: python3 script/ci/changed_groups.py | tee -a "${GITHUB_OUTPUT}"

  # docs group: commit lint + documentation checks. Always runs, it is cheap.
  docs-unit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the AI-attribution check below walks base..head.
          fetch-depth: 0

      # isaac#413: no commit of the PR may carry an AI attribution. Range is
      # base..head of the PR, so main's pre-existing history is not scanned.
      - name: PR commits carry no AI attribution
        if: github.event_name == 'pull_request'
        run: >-
          python3 script/ci/check_no_ai_attribution.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # The four READMEs' producer version table is generated, not written.
      # They carried `:0.0.1` for as long as `:0.0.2` existed, which is what a
      # hand-maintained table about "which Isaac Sim am I running" degrades
      # into. This fails the build instead of letting a reader find out.
      - name: Producer version table is current
        run: python3 script/ci/sync_producer_versions.py --check

      - name: Hosted docs-group pytest + group floor
        run: ./test/assert_pytest_baseline.sh --group docs

  # M1 hosted-unit gate (ADR-0017 section 7, isaac#130), core group. The hosted
  # unit suite needs no Isaac runtime and no GPU: assert_pytest_baseline.sh
  # runs it in a plain slim-python container (docker run), so this gate lives
  # on ubuntu-latest instead of the single self-hosted GPU runner. That frees
  # the GPU box to do only GPU work (core-gpu below) and lets the two run in
  # parallel.
  # Outside-collaborator PRs do NOT auto-trigger -- the org-level "Approval for
  # outside collaborators" gate holds them until a maintainer approves. This job
  # needs no fork gate of its own: ubuntu-latest runners are ephemeral and
  # GitHub-hosted, so untrusted code there costs nothing of ours.
  #
  # Enforces all-green + the core group's collected count >= its committed
  # floor (ratchet) + framework pure-surface coverage >= 80%.
  core-unit:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hosted core-group pytest + group floor + coverage gate
        run: ./test/assert_pytest_baseline.sh --group core

  stream-unit:
    needs: changes
    if: needs.changes.outputs.stream == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hosted stream-group pytest + group floor
        run: ./test/assert_pytest_baseline.sh --group stream

  # Dockerfile build + the devel-test bats specs, through the base reusable
  # workflow. The bats specs of a group the PR did not touch are skipped
  # (run_bats.sh, via BATS_SKIP_GROUPS); the gui / stream / headless stages
  # are built as extra stages only when selected, which a change to the shared
  # layer (sys, devel-base, devel) always does.
  core-build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ycpss91255-docker/base/.github/workflows/build-worker.yaml@v0.42.0
    with:
      image_name: docker
      # Isaac Sim base image is itself the runtime (15+ GB binary tree);
      # stripping to a separate "runtime" stage would save little while
      # forcing duplicate /isaac-sim copies. The runtime stage in
      # Dockerfile is intentionally commented out — disable the
      # base repo's build_runtime default so CI doesn't try to target it.
      build_runtime: false
      # Isaac Sim BASE_IMAGE is ~15 GB extracted; ubuntu-latest's ~14 GB
      # free disk is below threshold, so attempt 1 of every Isaac PR
      # rolls the dice on "no space left on device" during BuildKit COPY
      # (PR #68 attempt 1 lost, attempt 2 passed by timing luck). The
      # opt-in step from base#470 removes ~30 GB of Android SDK / .NET /
      # GHC tool-cache before buildx starts.
      free_disk_space: true
      extra_stages: ${{ needs.changes.outputs.stages }}
      build_args: |
        BATS_SKIP_GROUPS=${{ needs.changes.outputs.bats_skip }}

  # M2 GPU integration gate (PRD #4-int / isaac#132), core group: boots
  # headless Isaac for real on the self-hosted GPU runner (Kit refuses to boot
  # without an NVIDIA GPU runtime). needs: core-unit so a fast M1 failure skips
  # the expensive GPU run; it does NOT need core-build (it builds its own
  # devel-test image locally, warm-cached on the runner). The --gpu gate reads
  # the HOSTED_UNIT baseline NUMBER (it does not re-run the hosted suite).
  #
  # The job runs through the org reusable workflow gpu-self-hosted.yml, which
  # owns the runner labels, the pre-checkout workspace reclaim and the
  # checkout. The step logic lives in script/ci/gpu_integration_job.sh
  # (guard: test/bats/smoke/gpu_job_scripts_spec.bats). Every self-hosted job
  # in the org goes through that one workflow so the runner group can be
  # locked to it: a fork PR that edits its own workflow then cannot reach
  # the host.
  #
  # Fork-PR safety: this job is *structurally* gated to same-repo refs
  # (push / workflow_dispatch / PRs whose head is THIS repo), so a forked
  # PR's code can never execute on the self-hosted host -- not even if a
  # maintainer accidentally clicks "Approve and run". The reusable workflow
  # carries the same gate; this caller-side copy is kept so the gate is
  # visible here and holds even if the callee changes. This is stronger
  # than relying on the org-level outside-collaborator approval gate
  # alone, which is a human gate. Contributors with their own GPU can
  # still run the full suite in their own fork: a push in the fork
  # dispatches onto the fork owner's runner, never this host. See the
  # ycpss91255-docker/github_runner security model for the host-side
  # rationale (runner user is in the docker group == root-equivalent).
  core-gpu:
    needs: [changes, core-unit]
    # Runs when the core group is selected. Non-PR events (push / tag /
    # workflow_dispatch) always select it; PR events additionally run only
    # when the PR head repo IS this repo (a collaborator branch), never a
    # fork. Keeps untrusted fork code off the self-hosted GPU host.
    if: >-
      needs.changes.outputs.core == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ycpss91255-docker/.github/.github/workflows/gpu-self-hosted.yml@v0.4.0
    with:
      run-script: ./script/ci/gpu_integration_job.sh
      timeout-minutes: 30
      reap-container-filter: label=com.docker.compose.project=isaac-baseline-${{ github.run_id }}-${{ github.run_attempt }}

  # Stream group GPU job (isaac#434, formerly the nightly stream-smoke.yaml
  # schedule): boots the stream stage on the GPU runner and asserts the WebRTC
  # livestream serves a client (isaac#172 / #233). Runs when the stream group
  # is selected -- stream files changed, a shared layer changed, or push to
  # main / a release tag. Same fork guard as core-gpu. `workflow_dispatch` with
  # groups=stream (or running stream-smoke.yaml itself) starts it by hand.
  stream-smoke:
    needs: [changes, stream-unit]
    if: >-
      needs.changes.outputs.stream == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/stream-smoke.yaml

  # The single required check. Runs always() so a skipped scope cannot hold
  # it pending, and fails when any job failed or was cancelled, or when
  # `changes` itself did not succeed (script/ci/gate_result.py).
  gate:
    needs: [changes, docs-unit, core-unit, stream-unit, core-build, core-gpu, stream-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Every selected job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 script/ci/gate_result.py

  # Release waits for the gate: every group ran (a tag selects them all) and
  # passed.
  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/')
    uses: ycpss91255-docker/base/.github/workflows/release-worker.yaml@v0.42.0
    with:
      archive_name_prefix: docker
