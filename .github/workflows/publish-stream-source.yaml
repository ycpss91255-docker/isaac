name: Publish Stream-Source Producer (GHCR)

# isaac#223: publish the deterministic WebRTC stream-source producer image
# (the Dockerfile `producer` stage) to GHCR as a pullable, pinned tag, so
# the omniverse_web_viewer visual e2e (owv#48) and the Tier B browser-frames
# smoke (isaac#173) always have a real, reproducible WebRTC source.
#
# MANUAL ONLY. There is deliberately no push / tag trigger: the image must
# publish only when the maintainer dispatches this workflow (issue #223
# requires a pinned, immutable tag, not a `:latest` that moves on merge), so
# nothing is pushed to GHCR as a side effect of merging to main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable image tag to publish (e.g. 0.0.1)'
        required: true
        default: '0.0.3'

# Nothing by default; each job grants what it needs.
permissions: {}

jobs:
  # The dispatch input is the one untrusted value in this workflow. It is
  # validated here, on a hosted runner, before anything reaches the GPU host,
  # and the publish job reads only this job's output -- never inputs.tag --
  # because gpu-self-hosted.yml's script-env turns every line of an
  # interpolated value into a variable of its own (a newline in the tag would
  # add one).
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # A docker tag: [A-Za-z0-9_] then up to 127 of [A-Za-z0-9_.-]. Same
          # pattern script/ci/publish_stream_source.sh checks again.
          if ! [[ "${TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::tag must be a docker tag ([A-Za-z0-9_][A-Za-z0-9_.-]{0,127}), got '${TAG}'"
            exit 1
          fi
          printf 'tag=%s\n' "${TAG}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: [validate]
    # GPU runner, and the reason is isaac#252. This job used to say "Hosted
    # runner is fine ... No GPU needed -- Kit never boots at build time", and
    # that was exactly the defect: a workflow that never boots Kit cannot
    # discover that Kit will not stream. `:0.0.2` was built, pushed and
    # consumed before anyone learned it bound no port. The image is now proven
    # to stream on this runner BEFORE it is pushed, which needs a GPU.
    #
    # The job runs through the org reusable workflow gpu-self-hosted.yml, which
    # owns the self-hosted GPU runner labels, the fork-PR gate, the
    # pre-checkout workspace reclaim, the checkout, Buildx and the GHCR login.
    # Every self-hosted job in the org goes through that one workflow so the
    # runner group can be locked to it. The build -> prove -> push steps live
    # in script/ci/publish_stream_source.sh (guard:
    # test/unit/pytest/test_stream_source_producer.py), which also bounds the
    # smoke at 30 minutes, as the old step timeout did.
    #
    # The token is granted here, at the caller: a called workflow cannot widen
    # it. The registry login uses it without exporting it to the script, so
    # expose-github-token stays off.
    permissions:
      contents: read
      packages: write
    # One Kit on the GPU at a time, and never cancel mid-teardown.
    concurrency:
      group: isaac-publish-stream-source
      cancel-in-progress: false
    uses: ycpss91255-docker/.github/.github/workflows/gpu-self-hosted.yml@main
    with:
      run-script: bash script/ci/publish_stream_source.sh
      timeout-minutes: 90
      registry: ghcr.io
      setup-buildx: true
      script-env: |
        IMAGE_TAG=${{ needs.validate.outputs.tag }}
      artifact-name: producer-smoke-log-${{ needs.validate.outputs.tag }}
      artifact-path: .producer-smoke/
      artifact-when: failure
      artifact-if-no-files-found: ignore
